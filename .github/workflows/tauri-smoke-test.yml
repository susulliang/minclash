name: Tauri Smoke Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '*'

jobs:
  tauri-test:
    name: Desktop Smoke Test
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions/setup-rust@v1
        with:
          profile: minimal
          override: true

      - name: Install dependencies
        run: |
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            choco install wix -y
          fi
          cargo install tauri-cli

      - name: Build and Run Application
        run: |
          cargo tauri build
